<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iPhone 定位测试</title>
<style>body{margin:0;background:#f1f5f9;color:#17253b;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:24px;max-width:600px;margin:auto}h1{font-size:26px}.card{background:white;border:1px solid #dde4ee;border-radius:16px;padding:22px;margin-top:18px}button{border:0;border-radius:11px;padding:13px 18px;background:#1262c9;color:white;font-size:16px;font-weight:700;width:100%}a{color:#1262c9}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt{font-size:12px;color:#68758a}dd{margin:4px 0 0;font-size:18px;font-weight:650;word-break:break-word}.muted{color:#69788c;font-size:13px;line-height:1.5}#maplink{display:none;margin-top:14px}#status{margin:16px 0;color:#1b5b96}</style></head>
<body><main class="wrap"><h1>iPhone GPS定位测试</h1><p class="muted">此网页仅用于您在自己的iPhone上测试GPS定位权限与精度。不会自动上传、记录或向任何人共享坐标。</p>
<div class="card"><button id="locate">授权并获取本机位置</button><div id="status">尚未请求定位</div><dl><div><dt>纬度</dt><dd id="lat">--</dd></div><div><dt>经度</dt><dd id="lng">--</dd></div><div><dt>系统报告精度</dt><dd id="accuracy">--</dd></div><div><dt>获取时间</dt><dd id="time">--</dd></div></dl><a id="maplink" rel="noopener noreferrer" target="_blank">在苹果地图中查看这次坐标</a></div>
<div class="card"><strong>注意</strong><p class="muted">iPhone Safari定位要求网页处于安全环境（通常是HTTPS）。请将本文件上传到您控制的HTTPS静态网页服务后，使用Safari打开。此页只能测试前台定位，不能证明原生APP的后台运行能力。</p></div></main>
<script>document.getElementById('locate').onclick=()=>{const status=document.getElementById('status');if(!navigator.geolocation){status.textContent='此浏览器不支持地理位置接口';return;}if(!window.isSecureContext){status.textContent='页面不是安全环境。请使用HTTPS地址打开。';return;}status.textContent='等待iPhone定位授权及卫星/网络定位…';navigator.geolocation.getCurrentPosition(p=>{const {latitude,longitude,accuracy}=p.coords;document.getElementById('lat').textContent=latitude.toFixed(6);document.getElementById('lng').textContent=longitude.toFixed(6);document.getElementById('accuracy').textContent='± '+Math.round(accuracy)+' 米';document.getElementById('time').textContent=new Date(p.timestamp).toLocaleString();const l=document.getElementById('maplink');l.href='https://maps.apple.com/?ll='+encodeURIComponent(latitude+','+longitude)+'&q='+encodeURIComponent('这次定位');l.style.display='block';status.textContent='定位成功。此网页没有向服务器上传坐标。';},e=>{status.textContent='定位失败（'+e.code+'）：'+e.message+'。请检查Safari的网站定位权限、系统定位服务以及网络。';},{enableHighAccuracy:true,timeout:20000,maximumAge:0});};</script></body></html>
